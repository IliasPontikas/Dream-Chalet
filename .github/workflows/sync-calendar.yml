name: Sync calendar & weather

# Pulls the Airbnb / Booking.com iCal feeds every 3 hours and updates
# data/booked.json, which the availability calendar on the site reads.
# Also refreshes data/weather.json (5-day forecast from MET Norway).
# Set the feed links as repository secrets: AIRBNB_ICAL_URL, BOOKING_ICAL_URL

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-calendar
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch feeds
        env:
          AIRBNB_ICAL_URL: ${{ secrets.AIRBNB_ICAL_URL }}
          BOOKING_ICAL_URL: ${{ secrets.BOOKING_ICAL_URL }}
        run: python scripts/sync_ical.py
      - name: Fetch weather
        continue-on-error: true
        run: python scripts/sync_weather.py
      - name: Commit if changed
        run: |
          for f in data/booked.json data/weather.json; do [ -f "$f" ] && git add "$f"; done
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name  "calendar-sync"
          git config user.email "calendar-sync@users.noreply.github.com"
          git commit -m "Update booked dates / weather"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
